<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>fleet-dispatch-sim</title>
  </head>
  <body>
    <header class="top">
      <h1>fleet-dispatch-sim</h1>
      <p>Delivery robots on a city grid, one dispatch policy at a time. Same seed, same day.</p>
    </header>

    <main class="layout">
      <section class="stage" aria-label="Map">
        <div class="map" id="map-frame">
          <canvas id="map" role="img" aria-label="Live map of robots, jobs and chargers"></canvas>
        </div>
        <ul class="legend" aria-label="Legend">
          <li><i class="key robot-idle"></i>idle robot</li>
          <li><i class="key robot-empty"></i>driving to pickup</li>
          <li><i class="key robot-loaded"></i>carrying</li>
          <li><i class="key robot-charge"></i>charging</li>
          <li><i class="key pickup"></i>waiting pickup</li>
          <li><i class="key pickup taken"></i>assigned pickup</li>
          <li><i class="key dropoff"></i>drop-off</li>
          <li><i class="key charger"></i>charger</li>
        </ul>
      </section>

      <aside class="side">
        <section class="block" aria-label="Controls">
          <h2>Run</h2>
          <div class="field">
            <label for="policy">Policy</label>
            <select id="policy"></select>
          </div>
          <div class="field">
            <label for="pattern">Demand</label>
            <select id="pattern"></select>
          </div>
          <div class="row">
            <div class="field">
              <label for="seed">Seed</label>
              <input id="seed" type="number" min="0" step="1" value="1" inputmode="numeric" />
            </div>
            <div class="field">
              <label for="robots">Robots</label>
              <input id="robots" type="number" min="1" max="24" step="1" inputmode="numeric" />
            </div>
            <div class="field">
              <label for="rate">Jobs / hour</label>
              <input id="rate" type="number" min="0" max="600" step="10" inputmode="numeric" />
            </div>
          </div>
          <div class="field">
            <span class="label" id="speed-label">Speed</span>
            <div class="segmented" id="speed" role="group" aria-labelledby="speed-label"></div>
          </div>
          <div class="actions">
            <button id="play" type="button" class="primary">Pause</button>
            <button id="restart" type="button">Restart</button>
          </div>
          <p class="status" id="status" role="status"></p>
        </section>

        <section class="block" aria-label="Metrics">
          <h2>Metrics</h2>
          <dl class="metrics" id="metrics"></dl>
        </section>

        <section class="block" aria-label="Fleet">
          <h2>Fleet</h2>
          <ol class="fleet" id="fleet"></ol>
        </section>
      </aside>
    </main>

    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
